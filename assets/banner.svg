<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Максим: сайты и Telegram-боты с ИИ-инструментами">
  <defs>
    <radialGradient id="a" cx="82%" cy="18%" r="62%"><stop offset="0" stop-color="#db61a2" stop-opacity=".55"/><stop offset="1" stop-color="#db61a2" stop-opacity="0"/></radialGradient>
    <radialGradient id="b" cx="62%" cy="110%" r="58%"><stop offset="0" stop-color="#7c5cff" stop-opacity=".5"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="22" height="22" rx="5" fill="#fff" fill-opacity=".045"/></pattern>
    <clipPath id="c"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .n{font:800 104px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',sans-serif;fill:#fff;letter-spacing:-3px}
    .s{font:500 42px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',sans-serif;fill:#d9dee8}
    .t{font:600 26px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ee9ac8}
    .p{fill:#db61a2;animation:p 3.2s ease-in-out infinite}
    .p2{animation-delay:.8s}.p3{animation-delay:1.6s}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.p{animation:none;opacity:.8}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="380" fill="#0d1117"/>
    <rect width="1200" height="380" fill="url(#g)"/>
    <rect width="1200" height="380" fill="url(#a)"/>
    <rect width="1200" height="380" fill="url(#b)"/>
    <rect class="p" x="902" y="62" width="22" height="22" rx="5"/>
    <rect class="p p2" x="962" y="122" width="22" height="22" rx="5"/>
    <rect class="p p3" x="1052" y="62" width="22" height="22" rx="5"/>
    <rect class="p p2" x="1112" y="182" width="22" height="22" rx="5"/>
    <text class="t" x="64" y="96">Батуми · Claude Code · Codex</text>
    <text class="n" x="60" y="216">Максим</text>
    <text class="s" x="64" y="296">Сайты и Telegram-боты с ИИ-инструментами</text>
